// 时间格式化：秒 → m:ss
function fmtTime(sec) {
  const s = Math.max(0, Math.floor(sec));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
/* ============================ 7. 输入 ============================ */
let mouse = { x: -999, y: -999 };
// 屏幕坐标 → 画布逻辑坐标（画布缩放时也能点准）
function toCanvas(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function handleCodexClick(pt) {
  if (inRect(pt, INTRO_BACK)) { closeCodex(); return; }
  if (inRect(pt, CODEX_TAB_PLANT)) { codex.tab = 'plant'; sfx('ui'); return; }
  if (inRect(pt, CODEX_TAB_ZOMBIE)) { codex.tab = 'zombie'; sfx('ui'); return; }
  if (codex.tab === 'plant') {
    for (let i = 0; i < PLANT_ORDER.length; i++) {
      if (inRect(pt, codexPlantRect(i))) { codex.plant = PLANT_ORDER[i]; sfx('ui'); return; }
    }
  } else {
    for (let i = 0; i < ZOMBIE_ORDER.length; i++) {
      if (inRect(pt, codexZombieRect(i))) { codex.zombie = ZOMBIE_ORDER[i]; sfx('ui'); return; }
    }
  }
}
function handleClick(pt) {
  Sfx.init();                  // 首次手势解锁音频（浏览器要求）
  if (game.failVideo) {         // 结局短片：点击直接跳过
    game.failVideo.t = Math.max(game.failVideo.t, FAIL_VIDEO_TIME - 0.02);
    return;
  }
  if (game.result) {           // 结算界面：下一关 / 重开 / 换阵容 / 返回首页
    const r = game.result;
    if (inRect(pt, RESULT_PRIMARY)) {
      if (r.win && game.mode === 'level' && game.level < LEVEL_COUNT) nextLevel();
      else restartCurrent();
    } else if (inRect(pt, RESULT_PICK)) backToPick();
    else if (inRect(pt, RESULT_HOME)) goHome();
    return;
  }
  if (game.screen === 'codex') { handleCodexClick(pt); return; }
  if (!game.started) {
    if (game.screen === 'pick') {          // 选卡界面：点植物切换 / 确定出战 / 返回
      if (inRect(pt, PICK_CONFIRM)) {
        if (!game.pickedPlants.length) { showToast('至少选 1 种植物'); return; }   // 防止底部栏溢出
        game.started = true; game.screen = null; game.paused = false;
        resetGame(); sfx('ui'); return;
      }
      if (inRect(pt, PICK_BACK)) { game.screen = game.mode === 'level' ? 'level' : 'diff'; sfx('ui'); return; }
      for (let i = 0; i < PLANT_ORDER.length; i++) {
        if (inRect(pt, pickRect(i))) {
          const type = PLANT_ORDER[i], idx = game.pickedPlants.indexOf(type);
          if (idx >= 0) game.pickedPlants.splice(idx, 1);        // 再点一次取消
          else if (game.pickedPlants.length < 10) game.pickedPlants.push(type); // 最多 10 种
          else showToast('最多选 10 种');
          sfx('ui');
          return;
        }
      }
      if (inRect(pt, PICK_PRESET_A)) { applyPreset(PRESET_BEGINNER); sfx('ui'); return; }
      if (inRect(pt, PICK_PRESET_B)) { applyPreset(PRESET_POWER); sfx('ui'); return; }
      if (inRect(pt, PICK_CLEAR)) { game.pickedPlants = []; sfx('ui'); return; }
      return;
    }
    if (game.screen === 'diff') {          // 无尽难度 → 选卡界面
      for (const key of ['easy', 'medium', 'hard']) {
        if (inRect(pt, DIFF_RECTS[key])) { game.diff = DIFFICULTIES[key]; game.screen = 'pick'; sfx('ui'); return; }
      }
      if (inRect(pt, INTRO_BACK)) { game.screen = 'mode'; sfx('ui'); return; }
      return;
    }
    if (game.screen === 'level') {         // 关卡选择：点解锁的关卡 → 选卡（难度按关卡梯度）
      for (let i = 0; i < LEVEL_COUNT; i++) {
        if (inRect(pt, levelRect(i))) {
          if (i + 1 > levelUnlocked()) { showToast('先通关第 ' + i + ' 关！'); return; }
          game.mode = 'level';
          game.level = i + 1;
          game.levelTarget = i + 2;        // 第 n 关目标波数 = n+1
          game.diff = levelDiff(game.level); // 关卡难度逐关递增
          game.screen = 'pick';
          sfx('ui');
          return;
        }
      }
      if (inRect(pt, INTRO_BACK)) { game.screen = 'mode'; sfx('ui'); return; }
      return;
    }
    if (game.screen === 'mode') {          // 模式选择
      if (inRect(pt, MODE_LEVEL)) { game.mode = 'level'; game.screen = 'level'; sfx('ui'); return; }
      if (inRect(pt, MODE_ENDLESS)) { game.mode = 'endless'; game.screen = 'diff'; sfx('ui'); return; }
      if (inRect(pt, INTRO_BACK)) { game.screen = 'home'; sfx('ui'); return; }
      return;
    }
    if (game.screen === 'intro') {         // 简介
      if (inRect(pt, INTRO_BACK)) { game.screen = 'home'; sfx('ui'); return; }
      return;
    }
    // 首页
    if (inRect(pt, HOME_INTRO)) { game.screen = 'intro'; sfx('ui'); return; }
    if (inRect(pt, HOME_MODE)) { game.screen = 'mode'; sfx('ui'); return; }
    if (inRect(pt, HOME_CODEX)) { openCodex('home'); return; }
    return;
  }

  // 暂停菜单：暂停时只有菜单里的东西能点
  if (game.paused) {
    if (inRect(pt, PAUSE_RESUME)) { game.paused = false; sfx('ui'); return; }
    if (inRect(pt, PAUSE_RESTART)) { restartCurrent(); sfx('ui'); return; }
    if (inRect(pt, PAUSE_PICK)) { backToPick(); sfx('ui'); return; }
    if (inRect(pt, PAUSE_HOME)) { goHome(); sfx('ui'); return; }
    if (inRect(pt, PAUSE_CODEX)) { openCodex('pause'); return; }
    if (inRect(pt, PAUSE_AUTO)) { game.autoSun = !game.autoSun; saveSettings(); sfx('ui'); return; }
    if (inRect(pt, PAUSE_SOUND)) { game.sound = !game.sound; if (game.sound) Sfx.init(); saveSettings(); sfx('ui'); return; }
    return;
  }
  if (game.over) { game.overDelay = Math.max(game.overDelay, 1); return; }  // 定格一下，随后进短片

  // 1. 顶部控制按钮（热区外扩 6px，手机上也点得准）
  if (inRectPad(pt, RECT_PAUSE, 6)) { game.paused = true; sfx('ui'); return; }
  if (inRectPad(pt, RECT_SPEED, 6)) { game.speed = game.speed === 1 ? 2 : 1; saveSettings(); sfx('ui'); return; }
  if (inRectPad(pt, RECT_EXIT, 6)) {          // 退出本局 → 回到选卡（保留本关/难度与阵容）
    backToPick();
    sfx('ui');
    return;
  }
  // 2. 点阳光 → 收集（飞向顶部计数器入账）
  for (let i = game.suns.length - 1; i >= 0; i--) {
    const s = game.suns[i];
    if (s.state !== 'fly' && dist(pt.x, pt.y, s.x, s.y) <= 30) {
      s.state = 'fly'; s.tx = SUN_TX; s.ty = SUN_TY;   // 阳光收入动作
      return;
    }
  }
  // 3. 底部植物卡片（再次点击同一张 = 取消选中）
  const items = barItems(), CARD_X0 = cardX0(items.length);
  if (pt.y >= BAR_Y + 4 && pt.y <= H - 4 && pt.x >= CARD_X0) {
    const idx = Math.floor((pt.x - CARD_X0) / (CARD_W + CARD_GAP));
    if (idx >= 0 && idx < items.length) {
      const type = items[idx];
      if (type !== 'shovel' && (game.cd[type] || 0) > 0) { showToast(PLANT_TYPES[type].name + '冷却中'); return; } // 冷却中的植物不能选中
      game.selected = (game.selected === type) ? null : type;
      sfx('ui');
      return;
    }
  }
  // 4. 草坪种植
  if (pt.y >= GRID_TOP && pt.y < GRID_TOP + CELL_H * ROWS) {
    const col = clamp(Math.floor(pt.x / CELL_W), 0, COLS - 1);
    const row = clamp(Math.floor((pt.y - GRID_TOP) / CELL_H), 0, ROWS - 1);
    if (!game.selected) return;
    if (game.selected === 'shovel') { // 铲子：铲除植物，不返还阳光
      const p = plantAt(row, col);
      if (p) {
        game.plants = game.plants.filter(q => q !== p); // 立即移除
        addParticle(p.x, p.y, 'hit');                    // 铲除小提示
        game.selected = null;                            // 点一下放一下：铲完自动取消选中
        sfx('ui');
      } else showToast('这里没有植物');
      return;
    }
    const t = PLANT_TYPES[game.selected];
    const cdLeft = game.cd[game.selected] || 0;
    if (cdLeft > 0) { showToast(t.name + '冷却 ' + cdLeft.toFixed(1) + 's'); return; } // 该植物还没冷却好
    if (game.sun < t.cost) { showToast('阳光不足！'); return; }
    if (plantAt(row, col)) { showToast('该格已有植物！'); return; }
    createPlant(game.selected, row, col);   // 有僵尸的格子也允许种：种下后会被僵尸立刻啃食
    game.cd[game.selected] = t.cd || PLANT_COOLDOWN; // 该植物按自身冷却进入倒计时，其它植物互不影响
    game.selected = null;                   // 点一下放一下：种完自动取消选中
  }
}
// 回到选卡界面（保留当前难度/关卡与上次选择，方便快速重开）；对局内 R / 退出走这里
function backToPick() {
  saveRunIfNeeded();
  game.started = false;
  game.over = false;
  game.selected = null;
  game.paused = false;
  game.failVideo = null;
  game.overDelay = 0;
  game.result = null;
  game.toast = null;
  game.screen = 'pick';
}
// 中途退出 / 重开时把本局成绩记入历史最佳（结算流程已经记过的不重复）
function saveRunIfNeeded() {
  if (!game.result && (game.stats.kills > 0 || game.wave > 1)) recordBest();
}
// 立即用同一套阵容重开本关 / 本难度
function restartCurrent() {
  if (!game.pickedPlants.length) { backToPick(); return; }
  saveRunIfNeeded();
  game.started = true;
  game.screen = null;
  game.paused = false;
  game.result = null;
  game.failVideo = null;
  resetGame();
}
// 结算 → 下一关：沿用本局阵容，进入下一关的选卡
function nextLevel() {
  if (game.level >= LEVEL_COUNT) { restartCurrent(); return; }
  game.level++;
  game.levelTarget = game.level + 1;
  game.diff = levelDiff(game.level);
  backToPick();
  sfx('ui');
}
// 结算 / 任意处 → 回首页
function goHome() {
  saveRunIfNeeded();
  if (updateAvailable) { refreshToLatest(); return; }
  game.started = false;
  game.over = false;
  game.selected = null;
  game.paused = false;
  game.failVideo = null;
  game.overDelay = 0;
  game.result = null;
  game.toast = null;
  game.screen = 'home';
  game.pickedPlants = [];
}
function showToast(text) { game.toast = { text, ttl: 1.4 }; }

canvas.addEventListener('mousemove', e => { mouse = toCanvas(e); });
canvas.addEventListener('mousedown', e => { handleClick(toCanvas(e)); });
canvas.addEventListener('contextmenu', e => { e.preventDefault(); game.selected = null; }); // 右键取消选择
canvas.addEventListener('touchstart', e => {  // 触摸设备等价点击
  e.preventDefault();
  const t = e.touches[0];
  const pt = toCanvas(t);
  mouse = pt;                                 // 触摸没有 hover，用落点当预览位置
  handleClick(pt);
}, { passive: false });
window.addEventListener('keydown', e => {   // 空格暂停 / 1、2 切速度 / R 重开 / Esc 取消
  if (game.screen === 'codex') {
    if (e.key === 'Escape') { closeCodex(); e.preventDefault(); }
    return;
  }
  if (e.key === 'g' || e.key === 'G') {
    if (!game.started && game.screen === 'home') { openCodex('home'); e.preventDefault(); return; }
    if (game.paused) { openCodex('pause'); e.preventDefault(); return; }
  }
  if (e.key === ' ') {
    if (game.started && !game.over && !game.result && !game.failVideo) {
      game.paused = !game.paused;
      e.preventDefault();
    }
    return;
  }
  if (e.key === '1') { game.speed = 1; saveSettings(); return; }
  if (e.key === '2') { game.speed = 2; saveSettings(); return; }
  if (e.key === 'r' || e.key === 'R') {
    if (game.failVideo) return;
    if (game.result) {
      const r = game.result;
      if (r.win && game.mode === 'level' && game.level < LEVEL_COUNT) nextLevel();
      else restartCurrent();
      return;
    }
    if (game.started) restartCurrent();
    else if (game.screen !== 'home') goHome();
  }
  if (e.key === 'Escape') {
    if (game.paused) game.paused = false;
    else game.selected = null;
  }
});
// 切到后台自动暂停，避免回来时已经被僵尸偷家
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (game.started && !game.over && !game.result && !game.failVideo && !game.paused) game.paused = true;
  } else {
    checkForUpdate(false);   // 回到页面时顺便看看有没有新版本
  }
});
window.addEventListener('pagehide', saveRunIfNeeded);   // 关标签页前也把本局纪录存下

/* ============================ 8. 重置与主循环 ============================ */
function resetGame() {
  game.time = 0; game.sun = 50; game.selected = null; game.over = false; game.paused = false;
  game.plants.length = 0; game.zombies.length = 0; game.projectiles.length = 0;
  game.suns.length = 0; game.particles.length = 0;
  game.spawnTimer = game.diff.first; game.skySunTimer = game.diff.skyMin; game.cd = {}; game.toast = null; game.stats.kills = 0;
  game.wave = 1; game.waveTotal = smallWaveSize(1); game.waveLeft = smallWaveSize(1); game.waveKilled = 0; game.waveTimer = 0; game.waveGap = 0;
  game.bigPending = false; game.bigTimer = 0; game.bigCount = 0; game.lastGargWarn = -99;
  game.carts = [true, true, true, true, true];   // 每行最左 1 台小推车，开局 5 台齐全
  game.cartsMoving = [];                         // 正在冲刺的推车（触发后永久消失，本关不复原）
  game.iceTracks = [];                           // 清空冰道
  game.failVideo = null; game.overDelay = 0; game.result = null; game.newRecord = false; // 清结局短片 / 结算 / 纪录标记
  game.warn = { text: '请保护我方小屁孩课本', ttl: 2.5 };   // 开战红字提示（一行，无副标题）
}

// 统一游戏循环：requestAnimationFrame 驱动，dt 防跳变；2 倍速 = 同一帧跑两次 update（避免大步穿透）
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;   // 切后台回来 dt 过大会导致瞬间穿帮，做上限保护
  const running = game.started && !game.over && !game.result && !game.failVideo && !game.paused;
  if (running) for (let i = 0; i < game.speed; i++) update(dt);
  // 提示气泡统一在这里计时（菜单界面也能正常消失）
  if (game.toast) { game.toast.ttl -= dt; if (game.toast.ttl <= 0) game.toast = null; }
  // 失败瞬间：先定格 1 秒让玩家看清"课本被偷"，再播结局短片（黑底红字 4 秒）
  if (game.started && game.over && !game.failVideo && !game.result) {
    game.overDelay += dt;
    if (game.overDelay >= 1.0) game.failVideo = { t: 0 };
  }
  if (game.failVideo) {
    game.failVideo.t += dt;
    if (game.failVideo.t >= FAIL_VIDEO_TIME) {
      game.failVideo = null;
      recordBest();
      sfx('lose');
      game.result = { win: false, wave: game.wave, time: game.time, kills: game.stats.kills };
    }
  }
  draw();
  requestAnimationFrame(frame);
}
loadBest();       // 读历史最佳
loadSettings();   // 读音效 / 自动收阳光 / 倍速设置
resetGame();      // 初始化一局（未开始）
requestAnimationFrame(frame);
if (IS_HOSTED) {
  setTimeout(() => checkForUpdate(true), 4000);
  setInterval(() => checkForUpdate(false), 300000);
}
</script>
